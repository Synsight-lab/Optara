name: CI

# Optara PM. Jobs are added as the build plan (BUILD_PLAN.md) adds components: indexer, keepers,
# publisher (step 15) and frontend (step 16). The V2 workflow is in git history.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: fork tests against live Monad contracts (VEN-008)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.1
  PYTHON_VERSION: "3.11" # reference model and FFI differential tests (standard library only)
  FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"

jobs:
  # -----------------------------------------------------------------------------------------------
  # Solidity: format, warning-free build, unit / fuzz (10k) / differential (FFI) / gas tests
  # -----------------------------------------------------------------------------------------------
  contracts:
    name: Contracts · build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Format check
        run: forge fmt --check

      - name: Build (warnings are errors)
        run: forge build --deny warnings

      - name: Storage layout (upgradeable modules use ERC-7201 only; slot constants correct)
        run: python3 script/storage_check.py

      - name: Exported ABIs match the build (deployments/abi)
        run: python3 script/export_abis.py --check

      - name: Tests (CI depth)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

  # -----------------------------------------------------------------------------------------------
  # Fork tests against the live Monad mainnet (Kuru). Nightly or on demand only: they need network access and
  # must not block pushes on RPC availability. Not part of ci-success.
  # -----------------------------------------------------------------------------------------------
  fork:
    name: Contracts · fork tests and deployment rehearsal (Monad mainnet)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Fork tests
        env:
          FOUNDRY_PROFILE: fork
          FORK_RPC_URL: ${{ secrets.MONAD_RPC_URL || 'https://rpc.monad.xyz' }}
        run: forge test -vvv

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Deployment rehearsal on a mainnet fork (DEPLOYMENT.md §4.2)
        run: script/rehearse_fork.sh monad-mainnet ${{ secrets.MONAD_RPC_URL || 'https://rpc.monad.xyz' }}

  # -----------------------------------------------------------------------------------------------
  # Local deployment (DEPLOYMENT.md §4.1): the production deploy + listing batch on anvil, then the on-chain
  # verification and a deposit / mint / router round trip, all through real transactions.
  # -----------------------------------------------------------------------------------------------
  deploy:
    name: Contracts · local deployment (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Start anvil (Monad's 128 KB code size limit)
        run: |
          anvil --code-size-limit 131072 --silent &
          for _ in $(seq 1 30); do cast chain-id >/dev/null 2>&1 && break; sleep 1; done

      - name: Local stack
        run: forge script script/local/LocalStack.s.sol --rpc-url http://127.0.0.1:8545 --broadcast --disable-code-size-limit

      - name: Verify the deployment against its manifest
        env:
          NETWORK: local
        run: forge script script/Verify.s.sol --rpc-url http://127.0.0.1:8545

      - name: Smoke (deposit, mint with a fresh oracle update, router sell and buy)
        run: forge script script/local/Smoke.s.sol --rpc-url http://127.0.0.1:8545 --broadcast

  # -----------------------------------------------------------------------------------------------
  # Off-chain services (INDEXER_AND_KEEPERS.md, TESTING.md §2 "Services"): sdk, publisher, keepers and indexer,
  # each against the local stack on anvil; the indexer e2e runs the real Envio indexer on Postgres.
  # -----------------------------------------------------------------------------------------------
  services:
    name: Services · sdk, publisher, keepers, indexer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: envio-dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build contracts (the services deploy the local stack)
        working-directory: contract
        run: forge build

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated code is current (SDK ABIs; indexer types)
        run: |
          pnpm --filter @optara/sdk check:abi
          pnpm --filter @optara/indexer codegen

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests (one package at a time)
        run: pnpm -r --workspace-concurrency=1 test

  # -----------------------------------------------------------------------------------------------
  # Coverage gate (TESTING.md §7): core 100% lines and branches; other src/ files >= 95% / 90%
  # -----------------------------------------------------------------------------------------------
  coverage:
    name: Contracts · coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Gas benchmarks are excluded: coverage builds without the optimizer.
      - name: Coverage
        run: forge coverage --report lcov --report summary --no-match-coverage "(test|script)/" --no-match-path "test/gas/*"

      - name: Enforce thresholds
        run: python3 script/coverage_gate.py lcov.info

  # -----------------------------------------------------------------------------------------------
  # Specification: reference math, invariant simulation, test traceability, committed vectors
  # -----------------------------------------------------------------------------------------------
  reference:
    name: Spec · reference model and traceability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Math checks (MATH.md theorems and worked examples)
        run: python3 reference/verify_math.py --n 3000

      - name: Invariant simulation
        run: python3 reference/verify_invariants.py --runs 100 --steps 200

      - name: Test traceability (TEST_CASES.md covers every invariant, function, error, event, contract)
        run: python3 reference/check_traceability.py

      - name: Test vectors are up to date
        run: |
          python3 reference/gen_vectors.py
          if [ -n "$(git status --porcelain -- reference/vectors)" ]; then
            echo "::error::reference/vectors is stale. Run python3 reference/gen_vectors.py and commit the result."
            git status --porcelain -- reference/vectors
            exit 1
          fi

  # -----------------------------------------------------------------------------------------------
  # Single required check for branch protection
  # -----------------------------------------------------------------------------------------------
  # -----------------------------------------------------------------------------------------------
  # Static analysis (TESTING.md §8): Slither over src/. Reviewed findings are recorded in slither.db.json with their
  # rationale in SECURITY.md §8; any new finding fails the job.
  # -----------------------------------------------------------------------------------------------
  slither:
    name: Contracts · Slither
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      - name: Slither (fails on any finding not in the triage database)
        run: slither . --config-file slither.config.json --triage-database slither.db.json

  ci-success:
    name: CI passed
    if: always()
    needs: [contracts, deploy, services, coverage, reference, slither]
    runs-on: ubuntu-latest
    steps:
      - name: All blocking jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more required jobs did not succeed"
            exit 1
          fi

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Monad allows 128 KB runtime code.
code_size_limit = 131072
bytecode_hash = "none"
# Differential tests call the Python reference model (reference/) through FFI.
ffi = true
fs_permissions = [{ access = "read", path = "../reference/vectors" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]
# Fork tests need network access; they run only under the `fork` profile.
no_match_path = "test/fork/**"

[fuzz]
runs = 1000
seed = "0x4f707461726150"

[invariant]
runs = 128
depth = 64
fail_on_revert = false

# CI (TESTING.md §0.1 and §5): fuzz 10,000 runs; invariants 256 runs x depth 100.
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 100

# Nightly: fuzz 100,000 runs; invariants 5,000 runs x depth 300.
[profile.nightly.fuzz]
runs = 100000

[profile.nightly.invariant]
runs = 5000
depth = 300

[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/__nothing__/**" # override the default exclusion of fork tests

[fmt]
line_length = 120

# Lints guard production code; test files make deliberate casts and use cheatcodes freely.
[lint]
ignore = ["test/**/*.sol"]

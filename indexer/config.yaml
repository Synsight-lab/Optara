      - event: OracleStalled
      - event: AccountSettled
      - event: RecoveryRatioSet
      - event: SettlementClaimed
      - event: WrapperRedeemed
      - event: DustSwept
  - name: VenueRegistry
    abi_file_path: ../deployments/abi/VenueRegistry.json
